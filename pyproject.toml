[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tentaoptimering"
version = "0.1.0"
description = "Reproducerbar baslinje för en PoC om optimering av tentamenslokaler."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
]

[project.scripts]
tenta-baseline = "tentaoptimering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
