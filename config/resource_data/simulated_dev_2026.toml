# ---- Förhyrning av hela Fyrishov (två tillfällen per år). Hela anläggningen måste hyras, så kostnaden är fast per tillfälle. ----
# Uppgift från Fyrishov (fyrishov.txt, 2026-11-10): hyran är 303 026 kr per vecka (söndag 12:00 till fredag 22:30), sista tentan slutar fredag 19:00,
# och kostnaden 2026 är cirka 2,4 mnkr varav cirka 1,2 mnkr löner. Det som återstår efter lön och hyra för två veckor är kringkostnader (flytt av
# möbler, möblering m.m.): (2 400 000 - 1 200 000 - 2 x 303 026) / 2 = 296 974 kr per tillfälle. Den resten är härledd ur ett avrundat ("cirka")
# årsbelopp och därför modellberäknad, inte observerad. Perioderna är de veckor då bokningsunderlaget har tentor i Fyrishov (måndag-fredag);
# hyresperioden börjar söndagen före. Personalkostnaden vid Fyrishov ingår inte här (den prissätts som bemanning) och får inte läggas till igen.
# Sluttiden fredag 19:00 modelleras inte (det finns ingen sluttidsgräns per sal).

[[hire_window]]
id = "hw-fyrishov-2026-01"
name = "Fyrishov, januariveckan"
room_ids = ["uu-fyrishov-hall-d", "uu-fyrishov-hall-e", "uu-fyrishov-hall-f"]
start = "2026-01-12"
end = "2026-01-16"
cost_kr = 600000
origin = "model_calculated"
source = "Summan av hyran (uppgiven) och kringkostnaderna (härledd rest); se delposterna."
[[hire_window.part]]
label = "Hyra (söndag 12:00 till fredag 22:30)"
cost_kr = 303026
origin = "observed"
source = "Fyrishov, fyrishov.txt 2026-11-10: hyra 303 026 kr per vecka."
[[hire_window.part]]
